<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="learnify-bg" x1="16" y1="12" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366F1" />
      <stop offset="45%" stopColor="#4A3FD1" />
      <stop offset="100%" stopColor="#312682" />
    </linearGradient>

    <!-- Upper-Left Inset Highlight -->
    <linearGradient id="learnify-rim" x1="20" y1="16" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#FFFFFF" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
    </linearGradient>

    <!-- Lightning Bolt / Star Gradient -->
    <linearGradient id="bolt-grad" x1="56" y1="20" x2="84" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF7D1" />
      <stop offset="25%" stopColor="#FFDE6A" />
      <stop offset="65%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Book Pages / Academic Wing Gradient (Mint to Sky Blue) -->
    <linearGradient id="book-wing-left" x1="24" y1="65" x2="64" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E0FBF0" />
      <stop offset="50%" stopColor="#A7F3D0" />
      <stop offset="100%" stopColor="#34D399" />
    </linearGradient>

    <linearGradient id="book-wing-right" x1="64" y1="65" x2="104" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E0F2FE" />
      <stop offset="50%" stopColor="#BAE6FD" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadows for 3D depth -->
    <filter id="badge-shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" floodColor="#1E1656" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#1E1656" floodOpacity="0.25" />
    </filter>

    <filter id="element-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" floodColor="#1E1656" floodOpacity="0.3" />
    </filter>
  </defs>

  <!-- 1. 3D Rounded Squircle Badge Base -->
  <rect
    x="10"
    y="10"
    width="108"
    height="108"
    rx="32"
    fill="url(#learnify-bg)"
    filter="url(#badge-shadow)"
  />

  <!-- Upper-Left Glossy Inset Rim -->
  <rect
    x="11.5"
    y="11.5"
    width="105"
    height="105"
    rx="30.5"
    stroke="url(#learnify-rim)"
    strokeWidth="3"
    fill="none"
  />

  <!-- 2. Academic Open Book Wings (Forms a stylized "L" base) -->
  <g filter="url(#element-shadow)">
    <!-- Left Page Wing -->
    <path
      d="M26 84 C42 80, 56 82, 64 88 C64 96, 64 100, 64 100 C56 94, 42 92, 26 96 Z"
      fill="url(#book-wing-left)"
    />
    <!-- Right Page Wing -->
    <path
      d="M102 84 C86 80, 72 82, 64 88 C64 96, 64 100, 64 100 C72 94, 86 92, 102 96 Z"
      fill="url(#book-wing-right)"
    />
    <!-- Spine Inset Highlight -->
    <path
      d="M62 88 L66 88 L66 102 L64 100 L62 102 Z"
      fill="#FFFFFF"
      opacity="0.9"
    />
  </g>

  <!-- 3. Dynamic Center 3D Golden Lightning Bolt / Spark (Study & Compete Energy) -->
  <g filter="url(#element-shadow)">
    <!-- Main Bolt Silhouette -->
    <path
      d="M71 21 L39 63 L61 65 L47 101 L89 53 L66 50 Z"
      fill="url(#bolt-grad)"
      stroke="#FFFBEB"
      strokeWidth="2.5"
      strokeLinejoin="round"
      strokeLinecap="round"
    />
    <!-- Inner Core Specular Highlight -->
    <path
      d="M69 25 L45 59 L59 61 L54 75"
      stroke="#FFFFFF"
      strokeWidth="2"
      strokeLinecap="round"
      fill="none"
      opacity="0.9"
    />
  </g>

  <!-- 4. Puffy Accents / Sparkles -->
  <!-- Top Right 4-Point Star Sparkle -->
  <path
    d="M96 28 C96 28, 98 34, 104 35 C98 36, 96 42, 96 42 C96 42, 94 36, 88 35 C94 34, 96 28, 96 28 Z"
    fill="#FFDE6A"
    filter="url(#element-shadow)"
  />
  <circle cx="96" cy="35" r="1.5" fill="#FFFFFF" />

  <!-- Small Mint Glow Dot -->
  <circle cx="28" cy="40" r="3.5" fill="#A7F3D0" opacity="0.8" />
  <circle cx="27" cy="39" r="1.2" fill="#FFFFFF" />
</svg>